[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "easy-tech-help"
version = "0.1.0"
description = "Local text-based AI tech support for older adults and their families"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8,<3",
    "python-dotenv>=1,<2",
    "streamlit>=1,<2",
]

[project.optional-dependencies]
data = [
    "transformers==5.17.0",
]
training = [
    "torch==2.14.0",
    "transformers==5.17.0",
    "peft==0.21.0",
    "accelerate==1.15.0",
]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: opt-in integration checks requiring the local PyTorch model and adapter"]

[tool.ruff]
target-version = "py311"
line-length = 88
