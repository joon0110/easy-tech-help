[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "easy-tech-help"
version = "0.1.0"
description = "Local multimodal AI tech support for older adults and their families"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=11,<13",
    "pydantic>=2.8,<3",
    "python-dotenv>=1,<2",
    "streamlit>=1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: opt-in integration checks requiring local Ollama and a vision model"]

[tool.ruff]
target-version = "py311"
line-length = 88
